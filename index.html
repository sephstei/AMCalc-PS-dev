<!DOCTYPE html>
<html lang="de">
<head>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMCalc-PS">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<title>AMCalc-PS V2.7.1</title>

<style>
body { font-family: Arial; padding: 20px; }

.app-container {
    display: inline-block;
    width: 100%;
    max-width: 900px;
}

/* HEADER */
.header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 10px;
}

.header img {
    height: 50px;
    width: auto;
}

/* PRINT HEADER */
.print-header {
    display: none;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
    border-bottom: 2px solid #000;
    padding-bottom: 5px;
}

.print-header img {
    height: 40px;
}

/* Projektbereich */
.project-bar {
    background: #f5f5f5;
    padding: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 20px;
}

.project-top {
    display: flex;
    width: 100%;           
    margin-bottom: 12px;
}

.spacer {
    flex: 1;
}

.project-row {
    display: flex;
    align-items: center;
    gap: 10px;
	margin-bottom: 12px;
}

/* Inputs füllen Restbreite */
.project-row input,
.project-row select {
    flex: 1;        
    height: 36px;
    box-sizing: border-box;
    padding: 0 6px;
}

/* Buttons bleiben kompakt */
.project-row button {
    height: 36px;
    flex: 0 0 auto;
}

button {
    height: 36px;
    padding: 0 16px;
    cursor: pointer;
}

table {
    border-collapse: collapse;
    width: 100%;
}

td, th {
    border: 1px solid #ccc;
    padding: 4px;
}

td input,
td select {
    width: 100%;
    box-sizing: border-box;
    height: 28px;
}

.result {
    background: #f5f5f5;
}

.button-row {
    margin-top: 12px;
    display: flex;
    gap: 16px;
}

.selected {
    background: #d0ebff;
}

/* Overlay – erzwingt echtes Popup */
.dialog-overlay {
	position: fixed !important;
	top: 0 !important;
	left: 0 !important;
	right: 0 !important;
	bottom: 0 !important;

	width: 100% !important;
	height: 100% !important;

	background: rgba(0, 0, 0, 0.4);

	display: none;

	justify-content: center;
	align-items: center;

	z-index: 9999;
}

/* Dialog Box */
.dialog-box {
	background: white;
	padding: 20px;
	border-radius: 8px;

	min-width: 280px;
	max-width: 90%;

	box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* Buttons */
.dialog-buttons {
	margin-top: 15px;
	display: flex;
	gap: 10px;
	justify-content: flex-end;
}

.dialog-box input {
	width: 100%;
	height: 30px;
}

/* Einheitliche Schrift für alle Zellen */
td {
    font-size: 14px;
    vertical-align: middle;
}

/* gleiche Schrift auch in Inputs */
td input,
td select {
    font-size: 14px;
}

/* Ergebnis und Zeile explizit angleichen */
td.result,
#table td:first-child {
    font-size: 14px;
}

/* Druck */
.print-only {
    display: none;
}

.print-footer {
    position: absolute;
    left: -9999px;
    bottom: -9999px;
}

.version-info {
    margin-top: 8px;
    font-size: 10px;
    color: #888;
    text-align: left;
}

.button-row-inner {
    display: flex;
    gap: 10px;
    width: 100%;
	justify-content: space-between;	
}

.button-row-inner button {
    white-space: nowrap;
}


#projectList {
    color: #000;
}

#projectList.placeholder {
    color: #999;
}

#projectList option {
    color: #000;   /* echte Projekte IMMER schwarz */
}

#projectList option[disabled] {
    color: #999;   /* Placeholder im Dropdown grau */
}


@media print {

    body * { visibility: hidden; }

    #print-area, #print-area * { visibility: visible; }

    #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }

    .print-header {
        display: flex;
    }

    /* FIX: Seitenzählung startet bei 1 */
    body {
        counter-reset: page 1;
    }

    /* Footer maximal unten */
    

	.print-footer {
		position: static;
		margin-top: 10mm;   /* Abstand zur Tabelle */
		font-size: 8px;
		display: flex;
		justify-content: space-between;
		color: #666;
	}


    .footer-left {
        text-align: left;
    }

    .footer-right {
        text-align: right;
    }

    /* Seitenzahl */
    
	.pageNumber:after {
        content: "Seite " counter(page);
    }


    h1 {
        font-size: 20px;
        margin-bottom: 10px;
    }
	
	
	.print-only {
        display: inline;
    }

}

/* Seitenränder definieren */
@page {
    margin: 20mm 15mm 25mm 15mm;
}
``
</style>

<script>
let currentProject = null;
let backupImportData = null;
const tbody = document.querySelector("#table tbody");
const projectList = document.getElementById("projectList");
const projectName = document.getElementById("projectName");

let selectedRow = null;

function exportJSON(){

    let projects = getProjects();

    let blob = new Blob(
        [JSON.stringify(projects, null, 2)],
        { type: "application/json" }
    );

    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);

    link.download = "aufmass_backup.json";

    link.click();
}

function importJSON(){
	
	
    let input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";

    input.onchange = function(e){

        let file = e.target.files[0];
        if(!file) return;

        let reader = new FileReader();

        reader.onload = function(event){

            try {
                let data = JSON.parse(event.target.result);
				openBackupImportDialog(data);         

            } catch {
                alert("Fehler beim Import");
            }
        };

        reader.readAsText(file, "utf-8");
    };

    input.click();
}

function exportCurrentProject(){

    // prüfen ob Projekt ausgewählt
    if(!currentProject){
        alert("Bitte zuerst ein Projekt auswählen.");
        return;
    }

    // Projekte holen
    let projects = getProjects();

    // aktuelles Projekt holen
    let data = projects[currentProject];

    // JSON Datei erzeugen
    let blob = new Blob(
        [JSON.stringify(data, null, 2)],
        { type: "application/json" }
    );

    // Download starten
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = currentProject + ".json";

    link.click();
}

function importSingleProject(){

    let input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";

    input.onchange = function(e){

        let file = e.target.files[0];
        if(!file) return;

        let reader = new FileReader();

        reader.onload = function(event){

            try {
                // Datei lesen
                let projectData = JSON.parse(event.target.result);

                // minimale Validierung
                if(!Array.isArray(projectData)){
                    alert("Ungültige Projektdatei");
                    return;
                }

                // bestehende Projekte holen
                let projects = getProjects();

                // Projektname aus Datei
                let projectName = file.name.replace(".json", "");

                // prüfen ob Projekt existiert
                if(projects[projectName]){
                    if(!confirm("Projekt existiert bereits. Überschreiben?")){
                        return;
                    }
                }

                // Projekt hinzufügen / überschreiben
                projects[projectName] = projectData;

                // speichern
                localStorage.setItem("aufmass_projects", JSON.stringify(projects));

                // Dropdown aktualisieren
                
				// Dropdown neu laden
				loadProjectList();

				// importiertes Projekt aktiv setzen
				currentProject = projectName;

				let list = document.getElementById("projectList");
				list.value = projectName;

				// Tabelle laden
				loadTableData(projectData);

				// UI aktualisieren (falls du Farben nutzt)
				updateProjectListColor();

				alert("Projekt erfolgreich importiert!");


            } catch {
                alert("Fehler beim Import");
            }
        };

        reader.readAsText(file);
    };

    input.click();
}


function printTable(){

    // Statt projectName → currentProject verwenden
    document.getElementById("print-title").textContent =
        currentProject || "Kunde";

    document.getElementById("print-date").textContent =
        "Erstellt am: " + new Date().toLocaleString("de-DE");

    window.print();
}

function exportPDF(){

   window.print();
}

function getProjects(){
 return JSON.parse(localStorage.getItem("aufmass_projects") || "{}");
}

function exportCSV(){

    let rows = document.querySelectorAll("#tableBody tr");

    if(rows.length === 0){
        alert("Keine Daten vorhanden");
        return;
    }

    let csv = [];

    // Header
    csv.push("Beschreibung;Formel;Ergebnis;Einheit");

    rows.forEach((row, index) => {

        let cells = row.querySelectorAll("td");

        let text = cells[1].querySelector("input")?.value || "";
        let formula = cells[2].querySelector("input")?.value || "";
        let result = cells[3]?.innerText || "";
        let unit = cells[4].querySelector("select")?.value || "";

        csv.push([text, formula, result, unit].join(";"));
    });

    let blob = new Blob(["\uFEFF" + csv.join("\n")], {
    type: "text/csv;charset=utf-8;"
	});

    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);

    // schöner Dateiname
    let filename = currentProject ? currentProject + ".csv" : "aufmass.csv";
    link.download = filename;

    link.click();
}

function importCSV(){

    // Datei-Auswahl erzeugen
    let input = document.createElement("input");
    input.type = "file";
    input.accept = ".csv";

    input.onchange = function(e){

        let file = e.target.files[0];
        if(!file) return;

        let reader = new FileReader();

        reader.onload = function(event){

            let text = event.target.result;

            // UTF-8 BOM entfernen falls vorhanden
            if(text.charCodeAt(0) === 0xFEFF){
                text = text.slice(1);
            }

            let lines = text.split("\n").filter(l => l.trim() !== "");

            // erste Zeile = Header → überspringen
            lines.shift();

            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            lines.forEach(line => {

                let parts = line.split(";");

                let description = parts[0] || "";
                let formula = parts[1] || "";
                let unit = parts[3] || "m²";

                addRow(description, formula, unit);

            });

            recalcRowNumbers();
            calculate();

            // Kein aktives Projekt mehr (wie "Neues Aufmaß")
            currentProject = null;

            // Dropdown zurücksetzen
            let projectList = document.getElementById("projectList");
            projectList.selectedIndex = 0;
            updateProjectListColor();
        };

        reader.readAsText(file, "utf-8");
    };

    input.click();
}

function saveProjects(p){
 localStorage.setItem("aufmass_projects",JSON.stringify(p));
}

function loadTableData(data){

    let tbody = document.getElementById("tableBody");

    if(!tbody){
        console.error("tableBody fehlt beim Laden");
        return;
    }

    tbody.innerHTML = "";

    if(!data || !Array.isArray(data)){
        console.warn("keine Projektdaten vorhanden");
        return;
    }

    data.forEach(row => {
        addRow(
            row.text || "",
            row.formula || "",
            row.unit || "m²"
        );
    });

    recalcRowNumbers();
	calculate();
}

function loadProjectList(){

	console.log("loadProjectList Daten:", getProjects());
    let list = document.getElementById("projectList");
    let p = getProjects();

    // Placeholder neu erzeugen
    list.innerHTML = '<option value="" disabled selected>Projekt auswählen...</option>';

    Object.keys(p).forEach(k=>{
        let o = document.createElement("option");
        o.value = k;
        o.text = k;
        list.appendChild(o);
    });
	
	updateProjectListColor();
}

function updateProjectListColor(){

    let list = document.getElementById("projectList");

    if(!list) return;

    // Wenn Placeholder aktiv → Feld grau
    if(list.selectedIndex === 0){
        list.style.color = "#999";
    } else {
        list.style.color = "#000";
    }
}

function resetSelect(){
 projectList.value="__placeholder__";
 projectList.style.color="#999";
}

projectList.addEventListener("change",function(){
 this.style.color = (this.value==="__placeholder__") ? "#999" : "black";
});

function saveProject(){

    if(!currentProject){
        showDialog("save");
        return;
    }

    let p = getProjects();
    p[currentProject] = collectTableData();

    saveProjects(p);
    loadProjectList();
	
	document.getElementById("projectList").value = currentProject;
	updateProjectListColor();
}

function saveAsProject(){
    showDialog("save");
}

function loadProject(){

    let name = document.getElementById("projectList").value;

    if(!name) return;

    currentProject = name;

    let p = getProjects();
    loadTableData(p[name]);

    updateProjectListColor();
}

function newProject(){

    currentProject = null;

    let tableBody = document.getElementById("tableBody");

    if(!tableBody){
        console.error("tableBody nicht gefunden!");
        return;
    }

    tableBody.innerHTML = "";

    // 15 Default-Zeilen
    for(let i=0; i<15; i++){
        addRow();
    }
	
	
    // Dropdown zurücksetzen
    let projectList = document.getElementById("projectList");
	projectList.selectedIndex = 0;
    if(projectList){
        projectList.value = "";
    }
	updateProjectListColor();

}

function confirmSave(){

    let name = document.getElementById("saveInput").value.trim();
    if(!name) return;

    currentProject = name;

    let p = getProjects();
    p[name] = collectTableData();

    saveProjects(p);
    loadProjectList();
	
	document.getElementById("projectList").value = name;
	
	updateProjectListColor();

    closeDialog();
}

function deleteProject(){
 let n = projectList.value;
 if(!n || n==="__placeholder__") {
     alert("Bitte wählen");
     return;
 }

 showDialog("delete");
}

function confirmDelete(){
 let n = projectList.value;

 let p = getProjects();
 delete p[n];

 saveProjects(p);
 loadProjectList();
 newProject();

 closeDialog();
}

function renameProject(){
 let o = projectList.value;
 if(!o || o==="__placeholder__") {
     alert("Bitte wählen");
     return;
 }

 document.getElementById("renameInput").value = o;
 showDialog("rename");
}

function confirmRename(){

    let newName = document.getElementById("renameInput").value.trim();
    if(!newName) return;

    let p = getProjects();

    //  umkopieren
    p[newName] = p[currentProject];

    // altes löschen
    delete p[currentProject];

    // neuen Namen setzen
    currentProject = newName;

    saveProjects(p);

    // Dropdown neu aufbauen
    loadProjectList();

    // WICHTIG: neuen Wert wieder setzen!!
    let projectList = document.getElementById("projectList");
    projectList.value = newName;
	
	updateProjectListColor();

    // Dialog schließen
    closeDialog();
}


function showDialog(type){
 let overlay = document.getElementById("dialogOverlay");

 document.getElementById("deleteDialog").style.display = "none";
 document.getElementById("renameDialog").style.display = "none";
 document.getElementById("saveDialog").style.display = "none";

 if(type === "delete"){
     document.getElementById("deleteDialog").style.display = "block";
 }

 if(type === "rename"){
     document.getElementById("renameDialog").style.display = "block";
 }
 
 if(type === "save"){
    document.getElementById("saveDialog").style.display = "block";
}

 overlay.style.display = "flex";
}

function closeDialog(){
 document.getElementById("dialogOverlay").style.display = "none";
}

function collectTableData(){
 let d=[];
 document.querySelectorAll("#table tbody tr").forEach(r=>{
  d.push({
   text:r.children[1].querySelector("input").value,
   formula:r.children[2].querySelector("input").value,
   unit:r.children[4].querySelector("select").value
  });
 });
 return d;
}

function addRow(text="",formula="",unit="m²"){
 let tr=document.createElement("tr");
 
 tr.innerHTML=`
 <td></td>
 <td><input value="${text}"></td>
 <td><input value="${formula}"></td>
 <td class="result"></td>
 <td>
  <select>
   <option ${unit==="m²"?"selected":""}>m²</option>
   <option ${unit==="m"?"selected":""}>m</option>
   <option ${unit==="m³"?"selected":""}>m</option>
   <option ${unit==="Stk"?"selected":""}>Stk</option>
   <option ${unit==="pau"?"selected":""}>pau</option>
   <option ${unit==="g"?"selected":""}>pau</option>
   <option ${unit==="kg"?"selected":""}>pau</option>
  </select>
 </td>`;

 tr.onclick=()=>{
  selectedRow=tr;
  document.querySelectorAll("tbody tr").forEach(r=>r.classList.remove("selected"));
  tr.classList.add("selected");
 };

 tr.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",calculate));

 let tbody = document.getElementById("tableBody");

 if(!tbody){
    console.error("tbody nicht gefunden!");
    return;
 }

tbody.appendChild(tr);

 recalcRowNumbers();
}

function deleteSelectedRow(){
 if(!selectedRow)return alert("Auswählen");

 selectedRow.remove();
 recalcRowNumbers();
 calculate();
}

function recalcRowNumbers(){
 document.querySelectorAll("#table tbody tr").forEach((r,i)=>{
  r.children[0].textContent=i+1;
 });
}

function calculate(){
 document.querySelectorAll("#table tbody tr").forEach(r=>{
  let v=r.children[2].querySelector("input").value.replace(/,/g,".");
  let o=r.children[3];

  try{
   o.textContent=v?
    Number(eval(v)).toLocaleString("de-DE",{minimumFractionDigits:2})
    :"";
  }catch{
   o.textContent="Fehler";
  }
 });
}

function openBackupImportDialog(data){

    backupImportData = data;

    let dialogs = document.querySelectorAll(".dialog-box");
    dialogs.forEach(d => d.style.display = "none");

    document.getElementById("dialogOverlay").style.display = "flex";
    document.getElementById("backupImportDialog").style.display = "block";
}

function closeBackupImportDialog(){
    document.getElementById("backupImportDialog").style.display = "none";
    document.getElementById("dialogOverlay").style.display = "none";

    backupImportData = null;
}

function confirmBackupImport(){

    if(!backupImportData){
        closeBackupImportDialog();
        return;
    }

    // import durchführen
    localStorage.setItem("aufmass_projects", JSON.stringify(backupImportData));

    loadProjectList();

    currentProject = null;
    document.getElementById("projectList").selectedIndex = 0;

    newProject();
    updateProjectListColor();

    closeBackupImportDialog();

    alert("Backup erfolgreich importiert!");
}

window.onload = () => {

    loadProjectList();
    newProject();
	updateProjectListColor();
	
	// Klick außerhalb schließen
    document.getElementById("dialogOverlay").onclick = function(e){
        if(e.target === this){
            closeDialog();
        }};
		
	// Enter im Rename → OK
    document.getElementById("renameInput")
    .addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            confirmRename();
        }
    });	
	
	// ESC → Dialog schließen
	document.addEventListener("keydown", function(e){
		if(e.key === "Escape"){
			closeDialog();
		}
	});
};

</script>

</div>
<!-- Dialog Overlay -->
<div id="dialogOverlay" class="dialog-overlay">

    <!-- DELETE DIALOG -->
    <div id="deleteDialog" class="dialog-box">
        <p>Projekt wirklich löschen?</p>
        <div class="dialog-buttons">
            <button onclick="confirmDelete()">Ja</button>
            <button onclick="closeDialog()">Nein</button>
        </div>
    </div>

    <!-- RENAME DIALOG -->
    <div id="renameDialog" class="dialog-box">
        <p>Neuer Name:</p>
        <input id="renameInput" type="text">
        <div class="dialog-buttons">
            <button onclick="confirmRename()">OK</button>
            <button onclick="closeDialog()">Abbrechen</button>
        </div>
    </div>
	
	<!-- SAVE DIALOG -->
	<div id="saveDialog" class="dialog-box" style="display:none;">
		<p>Aufmaß speichern unter:</p>
		<input id="saveInput" type="text">
		<div class="dialog-buttons">
			<button onclick="confirmSave()">Speichern</button>
			<button onclick="closeDialog()">Abbrechen</button>
		</div>
	</div>
	
	<!-- BACKUP IMPORT DIALOG -->
	<div id="backupImportDialog" class="dialog-box" style="display:none;">
		<p>
			⚠️ Alle bestehenden Projekte werden überschrieben.<br><br>
			Fortfahren?
		</p>
		<div class="dialog-buttons">
			<button onclick="closeBackupImportDialog()">Abbrechen</button>
			<button onclick="confirmBackupImport()">Import starten</button>
		</div>
	</div>

</div>
</body>
</html>
